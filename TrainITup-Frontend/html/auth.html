<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - TrainITup</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');

        :root {
            --brand-primary: #6B4DFF;
            --brand-secondary: #00D4AA;
            --brand-accent: #FF6B9D;
            --brand-dark: #0F0F23;
            --brand-panel: #1A1A2E;
            --text-main: #ECECF6;
            --text-soft: #C7C7DF;
            --border-soft: rgba(255, 255, 255, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--brand-dark), var(--brand-panel));
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .container {
            background-color: var(--brand-panel);
            border-radius: 30px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-soft);
            position: relative;
            overflow: hidden;
            width: 850px;
            max-width: 100%;
            min-height: 550px;
            color: #fff;
        }

        /* Fixed the overlapping by ensuring forms are hidden when not active */
        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all 0.6s ease-in-out;
        }

        .sign-in {
            left: 0;
            width: 50%;
            z-index: 2;
            opacity: 1;
        }

        .container.active .sign-in {
            transform: translateX(100%);
            opacity: 0; /* Hide when sliding */
            z-index: 1;
        }

        .sign-up {
            left: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
        }

        .container.active .sign-up {
            transform: translateX(100%);
            opacity: 1;
            z-index: 5;
        }

        form {
            background-color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            height: 100%;
            text-align: center;
        }

        h1 { margin-bottom: 10px; font-size: 24px; }

        .social-icons { margin: 15px 0; }
        .social-icons a {
            border: 1px solid var(--border-soft);
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 5px;
            width: 40px;
            height: 40px;
            color: var(--text-main);
            text-decoration: none;
            transition: 0.3s;
        }
        .social-icons a:hover { background: rgba(107, 77, 255, 0.2); border-color: var(--brand-primary); color: var(--brand-primary); }

        span { font-size: 12px; color: var(--text-soft); margin-bottom: 10px; }

        input {
            background-color: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-soft);
            margin: 8px 0;
            padding: 12px 15px;
            font-size: 14px;
            border-radius: 10px;
            width: 100%;
            outline: none;
            color: var(--text-main);
            transition: 0.3s;
        }

        input::placeholder {
            color: var(--text-soft);
        }

        input:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--brand-secondary);
            box-shadow: 0 0 10px rgba(0, 212, 170, 0.2);
        }

        a.forgot-btn { color: var(--brand-secondary); font-size: 13px; text-decoration: none; margin: 10px 0; transition: 0.3s; }
        a.forgot-btn:hover { color: #00E6BB; }

        button {
            background: linear-gradient(135deg, var(--brand-primary), #8B73FF);
            color: #fff;
            font-size: 12px;
            padding: 12px 45px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-top: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 24px rgba(107, 77, 255, 0.35);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 30px rgba(107, 77, 255, 0.42);
        }
        button:active { transform: scale(0.95); }

        /* Overlay Logic */
        .toggle-container {
            position: absolute;
            top: 0;
            left: 50%;
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: all 0.6s ease-in-out;
            z-index: 1000;
        }

        .container.active .toggle-container { transform: translateX(-100%); }

        .toggle {
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            height: 100%;
            width: 200%;
            position: relative;
            left: -100%;
            transform: translateX(0);
            transition: all 0.6s ease-in-out;
        }

        .container.active .toggle { transform: translateX(50%); }

        .toggle-panel {
            position: absolute;
            width: 50%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 30px;
            text-align: center;
            top: 0;
            transition: all 0.6s ease-in-out;
        }

        .toggle-left { transform: translateX(-200%); }
        .container.active .toggle-left { transform: translateX(0); }
        .toggle-right { right: 0; transform: translateX(0); }
        .container.active .toggle-right { transform: translateX(200%); }

        button.ghost {
            background: transparent;
            border: 1px solid var(--text-main);
            box-shadow: none;
        }
        button.ghost:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: none;
        }

        .error-message { color: var(--brand-accent); font-size: 12px; margin-top: 10px; display: none; text-align: center; }

        @media (max-width: 768px) {
            .container {
                width: 100%;
                max-width: 100%;
            }
            
            .form-container {
                width: 100% !important;
            }
            
            .sign-in, .sign-up {
                width: 100% !important;
            }
        }
    </style>
</head>
<body>

    <div class="container" id="container">
        <div class="form-container sign-up">
            <form id="registrationForm" onsubmit="handleRegisterSubmit(event)">
                <h1>Create Account</h1>
                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-google"></i></a>
                    <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#"><i class="fa-brands fa-github"></i></a>
                </div>
                <span>or use your email for registration</span>
                <input type="text" id="regName" placeholder="Full Name" required>
                <input type="email" id="regEmail" placeholder="Email" required>
                <input type="password" id="regPass" placeholder="Password" required>
                <input type="password" id="regPassConfirm" placeholder="Confirm Password" required>
                <div id="regError" class="error-message"></div>
                <button type="submit">Sign Up</button>
            </form>
        </div>

        <div class="form-container sign-in">
            <form id="loginForm" onsubmit="handleLoginSubmit(event)">
                <h1>Sign In</h1>
                <div class="social-icons">
                    <a href="#"><i class="fa-brands fa-google"></i></a>
                    <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#"><i class="fa-brands fa-github"></i></a>
                </div>
                <span>or use your username & password</span>
                <input type="text" id="loginUsername" placeholder="Username" required>
                <input type="password" id="loginPass" placeholder="Password" required>
                <a href="#" class="forgot-btn">Forgot Your Password?</a>
                <div id="loginError" class="error-message"></div>
                <button type="submit">Sign In</button>
            </form>
        </div>

        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Welcome Back!</h1>
                    <p style="margin: 20px 0; font-size: 14px;">To keep connected with us please login with your info</p>
                    <button class="ghost" id="login">Sign In</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Hello, Friend!</h1>
                    <p style="margin: 20px 0; font-size: 14px;">Enter your personal details and start journey with us</p>
                    <button class="ghost" id="register">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('container');
        const registerBtn = document.getElementById('register');
        const loginBtn = document.getElementById('login');

        registerBtn.addEventListener('click', () => {
            container.classList.add("active");
        });

        loginBtn.addEventListener('click', () => {
            container.classList.remove("active");
        });

        // Security Guard: Redirect logged-in users
        (function() {
            const userId = localStorage.getItem('userId');
            const userRole = localStorage.getItem('userRole');
            
            if (userId && userRole) {
                let redirectUrl = 'index.html';
                
                switch(userRole.toUpperCase()) {
                    case 'ADMIN':
                        redirectUrl = 'super-admin.html';
                        break;
                    case 'TEACHER':
                        redirectUrl = 'teacher-dashboard.html';
                        break;
                    case 'STUDENT':
                        redirectUrl = 'student-dashboard.html';
                        break;
                    default:
                        redirectUrl = 'index.html';
                }
                
                window.location.replace(redirectUrl);
            }
        })();

        // Handle Registration
        function handleRegisterSubmit(event) {
            event.preventDefault();
            const errorDiv = document.getElementById('regError');
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPass').value;
            const confirmPassword = document.getElementById('regPassConfirm').value;

            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match!';
                errorDiv.style.display = 'block';
                return;
            }

            fetch('http://localhost:8080/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.token || data.id) {
                    localStorage.setItem('token', data.token || '');
                    localStorage.setItem('userId', data.id || data.userId);
                    localStorage.setItem('userRole', (data.role || 'STUDENT').toUpperCase());
                    window.location.href = 'student-dashboard.html';
                } else {
                    errorDiv.textContent = data.message || 'Registration failed';
                    errorDiv.style.display = 'block';
                }
            })
            .catch(() => {
                errorDiv.textContent = 'Server error. Please try again.';
                errorDiv.style.display = 'block';
            });
        }

        // Handle Login
        function handleLoginSubmit(event) {
            event.preventDefault();
            const errorDiv = document.getElementById('loginError');
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPass').value;

            fetch('http://localhost:8080/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(response => response.json())
            .then(data => {
                if (data.token || data.id) {
                    localStorage.setItem('token', data.token || '');
                    localStorage.setItem('userId', data.id || data.userId);
                    const role = (data.role || 'STUDENT').toUpperCase();
                    localStorage.setItem('userRole', role);
                    
                    if (role === 'ADMIN') window.location.href = 'super-admin.html';
                    else if (role === 'TEACHER') window.location.href = 'teacher-dashboard.html';
                    else if (role === 'STUDENT') window.location.href = 'student-dashboard.html';
                    else window.location.href = 'index.html';
                } else {
                    errorDiv.textContent = data.message || 'Invalid credentials';
                    errorDiv.style.display = 'block';
                }
            })
            .catch(() => {
                errorDiv.textContent = 'Server error. Please try again.';
                errorDiv.style.display = 'block';
            });
        }
    </script>
</body>
</html>
